<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KCEMS · Khawar Construction Expense Management</title>
    <meta name="description" content="Site expense management for Khawar Construction — fund supervisors, log field expenses, run the two-stage approval chain." />
    <meta name="theme-color" content="#070807" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KCEMS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      /* Applies the saved theme before the stylesheet paints. Without this a
         light-mode user gets a dark flash on every cold start while the bundle
         downloads. Dark is the default, so it needs no attribute — and if this
         script throws, that default is exactly what you get. */
      (function () {
        try {
          if (localStorage.getItem('kcems.theme') === 'light') {
            document.documentElement.dataset.theme = 'light';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#F4F4F1');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
